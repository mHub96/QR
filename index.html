<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الخفر - العيادة الاستشارية</title>
    
    <script>
        /** * SPEED HACK 1: PARALLEL FETCH
         * Start the handshake BEFORE the CSS or Body even exists.
         */
        const urlParams = new URLSearchParams(window.location.search);
        const service = urlParams.get('service');
        const ward = urlParams.get('ward');
        const webAppUrl = "https://script.google.com/macros/s/AKfycbzXPOdLnXVLfDNNj_WfVS4tT1HCb6qBzo5lghvX-pYZwCoCV4zcM5NOrJ5Jwp6x4qsJfg/exec";
        
        // This promise starts running immediately
        window.dataFetchPromise = (async () => {
            if (!service || !ward) return { error: "Missing params" };
            
            // SPEED HACK 2: SESSION CACHE
            // Check if we already fetched this in the last few minutes
            const cacheKey = `duty_${service}_${ward}`;
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                const parsed = JSON.parse(cached);
                // Only use cache if it's from today
                if (parsed.cacheDate === new Date().toDateString()) {
                    console.log("Loading from cache...");
                    return parsed.data;
                }
            }

            try {
                const res = await fetch(`${webAppUrl}?service=${service}&ward=${ward}&json=true&t=${Date.now()}`);
                const data = await res.json();
                if (data && data.success) {
                    sessionStorage.setItem(cacheKey, JSON.stringify({
                        data: data,
                        cacheDate: new Date().toDateString()
                    }));
                }
                return data;
            } catch (e) {
                return { error: "Offline" };
            }
        })();
    </script>

    <style>
        :root {
            --bg: #121212; --card-bg: #1e1e1e; --accent: #007BFF;
            --text: #ffffff; --success: #25D366; --max-ui-width: 300px;
        }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { 
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        input {
            width: 100%; max-width: var(--max-ui-width); padding: 18px; border-radius: 16px; 
            border: 2px solid #333; background: #1e1e1e; color: white; font-size: 1.4rem; 
            text-align: center; margin-bottom: 20px; outline: none;
        }
        #unlock-btn { 
            width: 100%; max-width: var(--max-ui-width); height: 60px;
            background: var(--accent); color: white; border-radius: 16px; border: none;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #unlock-btn:disabled { background: #333; color: #777; cursor: not-allowed; opacity: 0.6; }

        .container {
            display: none; width: 100%; max-width: 450px; background: var(--card-bg);
            border-radius: 28px; padding: 40px 24px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #333;
        }
        .badge { display: inline-block; padding: 8px 20px; background: rgba(0, 123, 255, 0.15); color: var(--accent); border-radius: 50px; font-weight: bold; margin-bottom: 15px; }
        .contact-info { background: #282828; padding: 24px; border-radius: 20px; margin: 30px 0; }
        .phone-num { font-size: 1.8rem; direction: ltr; display: block; color: var(--accent); font-weight: 800; }
        .btn-group { display: flex; gap: 14px; }
        .action-btn { flex: 1; padding: 18px; border-radius: 16px; text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; color: white; }
        .loader { width: 18px; height: 18px; border: 2px solid #fff; border-bottom-color: transparent; border-radius: 50%; animation: rot 1s linear infinite; }
        @keyframes rot { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="font-size: 3.5rem;">🛡️</div>
        <h2>دخول المصرح لهم</h2>
        <p id="status" style="color:#888; margin-bottom: 20px;">جاري الاتصال...</p>
        <input type="password" id="pw" pattern="[0-9]*" inputmode="numeric" placeholder="••••">
        <button id="unlock-btn" onclick="unlock()" disabled>
            <span id="loader-icon" class="loader"></span>&nbsp;
            <span id="btn-text">جاري التحميل...</span>
        </button>
    </div>

    <div class="container" id="main-content">
        <div class="badge" id="service-display">...</div>
        <h1 id="name-display">...</h1>
        <div class="contact-info">
            <span style="color:#888;">رقم الهاتف المباشر</span>
            <span class="phone-num" id="phone-display">...</span>
        </div>
        <div class="btn-group">
            <a href="#" id="call-link" class="action-btn" style="background:var(--accent)">📞 اتصال</a>
            <a href="#" id="wa-link" class="action-btn" style="background:var(--success); display:none;">💬 واتساب</a>
        </div>
        <div id="time-stamp" style="margin-top:25px; color:#555; font-size:0.8rem; direction: ltr;"></div>
    </div>

    <script>
        let dutyData = null;

        /**
         * Wait for the early fetch to finish
         */
        async function init() {
            const data = await window.dataFetchPromise;
            const btn = document.getElementById('unlock-btn');
            const status = document.getElementById('status');
            
            if (data && !data.error) {
                dutyData = data;
                status.innerText = "جاهز للدخول ✅";
            } else {
                status.innerText = data.error === "Offline" ? "وضع المعاينة" : "لا توجد بيانات";
            }

            document.getElementById('loader-icon').style.display = 'none';
            document.getElementById('btn-text').innerText = "دخول";
            btn.disabled = false;
        }

        function unlock() {
            const pass = document.getElementById('pw').value;
            const correct = dutyData ? dutyData.password.toString() : "1234";

            if (pass === correct) {
                if (dutyData) {
                    document.getElementById('service-display').innerText = dutyData.resident.serviceArabic;
                    document.getElementById('name-display').innerText = dutyData.resident.name;
                    document.getElementById('phone-display').innerText = dutyData.resident.phone;
                    document.getElementById('time-stamp').innerText = dutyData.timestamp;
                    document.getElementById('call-link').href = "tel:" + dutyData.resident.phone;
                    if (dutyData.whatsappDigits) {
                        const wa = document.getElementById('wa-link');
                        wa.style.display = 'flex';
                        wa.href = "https://wa.me/" + dutyData.whatsappDigits;
                    }
                }
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                alert("الرمز خطأ ❌");
                document.getElementById('pw').value = "";
            }
        }

        document.getElementById('pw').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter' && !document.getElementById('unlock-btn').disabled) unlock(); 
        });

        init();
    </script>
</body>
</html>
