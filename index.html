<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الخفر - العيادة الاستشارية</title>
    <style>
        :root {
            --bg: #121212; 
            --card-bg: #1e1e1e; 
            --accent: #007BFF;
            --text: #ffffff; 
            --success: #25D366;
            --input-width: 85%;
            --max-ui-width: 320px;
        }
        
        * { box-sizing: border-box; transition: all 0.3s ease; }
        
        body { 
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        /* Container for Main Content */
        .container {
            width: 100%; max-width: 450px; background: var(--card-bg);
            border-radius: 28px; padding: 40px 24px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #333;
        }

        .badge {
            display: inline-block; padding: 8px 20px; background: rgba(0, 123, 255, 0.15);
            color: var(--accent); border-radius: 50px; font-size: 0.95rem; margin-bottom: 15px; font-weight: bold;
        }

        .contact-info { background: #282828; padding: 24px; border-radius: 20px; margin: 30px 0; border: 1px solid #383838; }
        .phone-num { font-size: 1.8rem; direction: ltr; display: block; color: var(--accent); font-weight: 800; }
        
        .btn-group { display: flex; gap: 14px; }
        
        .btn {
            flex: 1; padding: 18px; border-radius: 16px; text-decoration: none;
            font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; cursor: pointer;
        }
        .btn-call { background: var(--accent); color: white; }
        .btn-wa { background: var(--success); color: white; display: none; }

        /* Lock Screen Styling */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
            padding: 20px;
        }

        /* Fixed the button width issue by matching input and button widths */
        input {
            width: var(--input-width); max-width: var(--max-ui-width); padding: 18px; border-radius: 16px; border: 2px solid #333;
            background: #1e1e1e; color: white; font-size: 1.4rem; text-align: center; margin: 25px 0;
        }
        input:focus { border-color: var(--accent); outline: none; }

        #unlock-btn { 
            width: var(--input-width); 
            max-width: var(--max-ui-width); 
            min-height: 60px;
        }

        #main-content { display: none; width: 100%; max-width: 450px; }

        /* Spinner */
        .loader { width: 18px; height: 18px; border: 2px solid #fff; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="font-size: 3.5rem; margin-bottom: 15px;">🛡️</div>
        <h2 style="margin: 0;">دخول المصرح لهم</h2>
        <p id="status" style="color:#888; margin-top: 10px;">جاري تحميل بيانات الطبيب...</p>
        
        <input type="password" id="pw" pattern="[0-9]*" inputmode="numeric" placeholder="••••">
        
        <button id="unlock-btn" onclick="unlock()" class="btn btn-call">
            <span id="loader-icon" class="loader"></span>&nbsp;
            <span id="btn-text">دخول</span>
        </button>
    </div>

    <div class="container" id="main-content">
        <div class="badge" id="service-display">...</div>
        <h1 id="name-display" style="margin-top: 0;">...</h1>
        
        <div class="contact-info">
            <span style="color:#888; font-size: 0.9rem;">رقم الهاتف المباشر</span>
            <span class="phone-num" id="phone-display">...</span>
        </div>
        
        <div class="btn-group">
            <a href="#" id="call-btn" class="btn btn-call">📞 اتصال هاتفـي</a>
            <a href="#" id="wa-btn" class="btn btn-wa">💬 واتساب</a>
        </div>
        
        <div id="time-display" style="margin-top:30px; color:#666; font-size:0.85rem; direction: ltr;"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const service = urlParams.get('service');
        const ward = urlParams.get('ward');
        const webAppUrl = "https://script.google.com/macros/s/AKfycbzXPOdLnXVLfDNNj_WfVS4tT1HCb6qBzo5lghvX-pYZwCoCV4zcM5NOrJ5Jwp6x4qsJfg/exec";
        
        let dutyData = null;

        async function init() {
            if (!service || !ward) {
                document.getElementById('status').innerText = "⚠️ رابط غير صحيح (نقص بيانات)";
                document.getElementById('loader-icon').style.display = 'none';
                return;
            }

            try {
                // Add a timestamp to prevent caching issues
                const res = await fetch(`${webAppUrl}?service=${service}&ward=${ward}&json=true&t=${Date.now()}`, {
                    method: 'GET', mode: 'cors', redirect: 'follow'
                });
                const data = await res.json();
                
                if (data && !data.error) {
                    dutyData = data;
                    document.getElementById('status').innerText = "جاهز للدخول ✅";
                } else {
                    document.getElementById('status').innerText = "لا يوجد خفر حالياً 📅";
                    console.log("API Error:", data.error);
                }
            } catch (e) {
                document.getElementById('status').innerText = "وضع المعاينة (اضغط دخول)";
                console.warn("Offline/Fetch error:", e);
            }
            document.getElementById('loader-icon').style.display = 'none';
        }

        function unlock() {
            const pass = document.getElementById('pw').value;
            // Default to '1234' only if connection failed and we are in offline/test mode
            const correct = dutyData ? dutyData.password.toString() : "1234";

            if (pass === correct) {
                if (dutyData) {
                    document.getElementById('service-display').innerText = dutyData.resident.serviceArabic;
                    document.getElementById('name-display').innerText = dutyData.resident.name;
                    document.getElementById('phone-display').innerText = dutyData.resident.phone;
                    document.getElementById('time-display').innerText = dutyData.timestamp;
                    document.getElementById('call-btn').href = "tel:" + dutyData.resident.phone;
                    
                    if (dutyData.whatsappDigits) {
                        const waBtn = document.getElementById('wa-btn');
                        waBtn.style.display = 'flex';
                        waBtn.href = "https://wa.me/" + dutyData.whatsappDigits;
                    }
                } else {
                    // Placeholder data if Google Script couldn't be reached
                    document.getElementById('name-display').innerText = "نموذج تجريبي";
                    document.getElementById('service-display').innerText = "لم يتم جلب البيانات";
                }
                
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                alert("الرمز خطأ ❌");
                document.getElementById('pw').value = "";
            }
        }

        // Allow pressing "Enter" to unlock
        document.getElementById('pw').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') unlock();
        });

        init();
    </script>
</body>
</html>
