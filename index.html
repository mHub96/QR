<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>On-Call Pro</title>
    <style>
        :root {
            --primary: #007aff;
            --success: #25D366;
            --bg: #000000;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        .mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.2) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(37, 211, 102, 0.1) 0px, transparent 50%);
            z-index: -1; filter: blur(40px);
        }
        .container {
            width: 90%; max-width: 380px; padding: 40px 30px;
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 40px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .icon-box { width: 85px; height: 85px; margin: 0 auto 25px; background: rgba(255,255,255,0.05); border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; border: 1px solid var(--border); }
        h2 { font-weight: 700; font-size: 1.7rem; margin-bottom: 10px; }
        #status { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 35px; letter-spacing: 0.5px; }
        
        select, input[type="password"] {
            width: 100%; height: 70px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); border-radius: 22px;
            color: white; font-size: 1.2rem; text-align: center; margin-bottom: 15px;
            appearance: none; -webkit-appearance: none;
        }
        input[type="password"] { font-size: 2.5rem; letter-spacing: 12px; }
        
        button {
            width: 100%; height: 65px; background: white; color: black;
            border: none; border-radius: 22px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; margin-top: 10px; transition: transform 0.2s;
        }
        button:active { transform: scale(0.96); }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }

        .badge { background: var(--primary); color: white; padding: 6px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; display: inline-block; margin-bottom: 15px; text-transform: uppercase; }
        .name-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }
        .info-card { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 30px; border: 1px solid var(--border); margin-bottom: 30px; }
        .phone-val { font-size: 1.8rem; font-weight: 800; direction: ltr; display: block; color: var(--primary); }
        
        .btn-action { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px; border-radius: 22px; text-decoration: none; color: white; font-weight: 700; flex: 1; }
        .btn-call { background: #1a1a1a; border: 1px solid var(--border); }
        .btn-wa { background: var(--success); }
        
        .hidden { display: none !important; }
        option { background: #111; color: white; }
    </style>
</head>
<body>
    <div class="mesh"></div>

    <div id="entry-screen" class="container">
        <div class="icon-box" id="entry-icon">🛡️</div>
        <h2 id="entry-title">System Access</h2>
        <p id="status">Establishing Secure Connection...</p>
        <div id="login-form">
            <input type="password" id="pw" inputmode="numeric" placeholder="••••" maxlength="4">
            <button id="entry-btn" onclick="handleEntry()" disabled>Enter System</button>
        </div>
    </div>

    <div id="lookup-view" class="container hidden">
        <div class="badge" id="service-display">SERVICE</div>
        <h1 class="name-title" id="name-display">...</h1>
        <div class="info-card">
            <span style="font-size: 0.7rem; color: rgba(255,255,255,0.3); letter-spacing: 1px;">CONTACT NUMBER</span>
            <span class="phone-val" id="phone-display">...</span>
        </div>
        <div style="display: flex; gap: 12px;">
            <a href="#" id="call-link" class="btn-action btn-call">📞 Call</a>
            <a href="#" id="wa-link" class="btn-action btn-wa" style="display:none;">💬 WhatsApp</a>
        </div>
        <p id="time-stamp" style="margin-top:35px; font-size:0.65rem; opacity:0.2; direction:ltr;"></p>
    </div>

    <div id="register-view" class="container hidden">
        <div class="badge">DOCTOR REGISTRY</div>
        <h2 style="margin-bottom: 5px;">Duty Registry</h2>
        <p id="reg-status" style="font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 25px;">Select your section and name</p>
        
        <select id="spec-select" onchange="toggleNameSection()">
            <option value="">-- Select Specialty --</option>
            <option value="NS">Neuro</option>
            <option value="CT">Thoracic</option>
            <option value="GS">Surgery</option>
            <option value="US">Uro</option>
            <option value="ENT">ENT</option>
            <option value="H">Cardio</option>
            <option value="D">DeathCertificates</option>
            <option value="OP">OP Anesthesia</option>
            <option value="ICU">ICU Anesthesia</option>
            <option value="R">Radio</option>
            <option value="ON">Onco</option>
            <option value="PS">Plastic</option>
        </select>

        <div id="name-section" class="hidden">
            <select id="name-list"></select>
            <button id="submit-btn" onclick="submitRegistration()">Confirm Duty ✅</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode'); // "register"
        const service = urlParams.get('service');
        const ward = urlParams.get('ward');
        
        // PASTE YOUR NEW DEPLOYMENT URL HERE
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwj99w9IceN2W1aF3S-jN6yFypMBszvb1xv7FTUuYrW-GbYjC4ediZHrscrloeprwCSSw/exec";

        let serverData = null;

        // INITIALIZATION
        window.onload = async function() {
            if (mode === 'register') {
                document.getElementById('entry-title').innerText = "Doctor Login";
                document.getElementById('entry-icon').innerText = "🩺";
                await prepareRegister();
            } else if (service) {
                await prepareLookup();
            } else {
                document.getElementById('status').innerText = "⚠️ Link Incomplete";
            }
        };

        // FETCHING DATA FROM GOOGLE
        async function fetchFromScript(query) {
            const response = await fetch(`${scriptUrl}?${query}`, {
                method: "GET",
                mode: "cors",
                redirect: "follow"
            });
            return await response.json();
        }

        async function prepareLookup() {
            try {
                serverData = await fetchFromScript(`service=${service}&ward=${ward || service}&json=true&t=${Date.now()}`);
                if (serverData && !serverData.error) {
                    document.getElementById('status').innerText = "Secure Connection Verified ✅";
                    document.getElementById('entry-btn').disabled = false;
                } else {
                    document.getElementById('status').innerText = "No Schedule Found for Today";
                }
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = "Connection Error (CORS)";
            }
        }

        async function prepareRegister() {
            try {
                const names = await fetchFromScript(`action=getNames`);
                const dropdown = document.getElementById('name-list');
                dropdown.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
                document.getElementById('status').innerText = "Doctor List Updated ✅";
                document.getElementById('entry-btn').disabled = false;
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = "Error Loading Database";
            }
        }

        // ACCESS CONTROL
        function handleEntry() {
            const passInput = document.getElementById('pw').value;
            // Uses password from server or default 1234
            const correctPass = (serverData && serverData.password) ? serverData.password.toString() : "1234";
            
            if (passInput === correctPass) {
                document.getElementById('entry-screen').classList.add('hidden');
                if (mode === 'register') {
                    document.getElementById('register-view').classList.remove('hidden');
                } else {
                    showLookupUI();
                }
            } else {
                alert("Access Denied: Incorrect Password");
                document.getElementById('pw').value = "";
            }
        }

        // UI RENDERING
        function showLookupUI() {
            if (serverData) {
                document.getElementById('service-display').innerText = serverData.resident.serviceArabic;
                document.getElementById('name-display').innerText = serverData.resident.name;
                document.getElementById('phone-display').innerText = serverData.resident.phone;
                document.getElementById('time-stamp').innerText = "Retrieved: " + serverData.timestamp;
                document.getElementById('call-link').href = "tel:" + serverData.resident.phone;
                
                if (serverData.whatsappDigits) {
                    const wa = document.getElementById('wa-link');
                    wa.style.display = 'flex';
                    wa.href = "https://wa.me/" + serverData.whatsappDigits;
                }
            }
            document.getElementById('lookup-view').classList.remove('hidden');
        }

        function toggleNameSection() {
            const spec = document.getElementById('spec-select').value;
            document.getElementById('name-section').classList.toggle('hidden', !spec);
        }

        // DATA SUBMISSION
        async function submitRegistration() {
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            const payload = {
                action: "submitDuty",
                specialty: document.getElementById('spec-select').value,
                name: document.getElementById('name-list').value
            };

            try {
                // Post requires no-cors sometimes for Google, but we try standard first
                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors', // Crucial for Google Apps Script POST
                    body: JSON.stringify(payload)
                });
                alert("Duty Successfully Registered ✅");
            } catch (e) {
                alert("Submission Error - Check Connection");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
