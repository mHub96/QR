<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://script.google.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>On-Call Pro 🇮🇶</title>
    
    <style>
        :root {
            --primary: #007aff;
            --success: #25D366;
            --bg: #000000;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        .mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 211, 102, 0.1) 0px, transparent 50%);
            z-index: -1; filter: blur(40px);
        }

        .container {
            width: 90%; max-width: 380px;
            padding: 40px 30px;
            background: var(--glass);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-box {
            width: 85px; height: 85px;
            margin: 0 auto 25px;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem;
            border: 1px solid var(--border);
        }

        h2 { font-weight: 700; font-size: 1.7rem; margin-bottom: 10px; }
        #status { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 35px; }

        input[type="password"] {
            width: 100%; height: 70px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 22px;
            color: white; font-size: 2.5rem; text-align: center;
            letter-spacing: 12px; transition: 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

        button {
            width: 100%; height: 65px;
            background: white; color: black;
            border: none; border-radius: 22px;
            font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s;
        }

        button:disabled { background: #222; color: #555; }

        .badge {
            background: var(--primary); color: white;
            padding: 6px 14px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 800;
            display: inline-block; margin-bottom: 15px;
        }

        .name-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; }

        .info-card {
            background: rgba(255,255,255,0.03);
            padding: 25px; border-radius: 30px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .phone-val { font-size: 1.8rem; font-weight: 800; direction: ltr; display: block; color: var(--primary); }

        .btn-action {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 20px; border-radius: 22px;
            text-decoration: none; color: white; font-weight: 700;
            font-size: 0.95rem; flex: 1; transition: 0.2s;
        }

        .btn-call { background: #1a1a1a; border: 1px solid var(--border); }
        .btn-wa { background: var(--success); }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }
        .shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>

    <div class="mesh"></div>

    <div id="lock-screen" class="container">
        <div class="icon-box">🇮🇶</div>
        <h2>دخول النظام</h2>
        <p id="status">جاري تأمين الاتصال...</p>
        <input type="password" id="pw" inputmode="numeric" placeholder="••••">
        <button id="unlock-btn" onclick="unlock()" disabled>دخول</button>
    </div>

    <div id="main-content" class="container" style="display:none;">
        <div class="badge" id="service-display">SERVICE</div>
        <h1 class="name-title" id="name-display">...</h1>
        <div class="info-card">
            <span style="font-size: 0.7rem; color: rgba(255,255,255,0.3);">رقم الهاتف المباشر</span>
            <span class="phone-val" id="phone-display">...</span>
        </div>
        <div style="display: flex; gap: 12px;">
            <a href="#" id="call-link" class="btn-action btn-call">📞 اتصال</a>
            <a href="#" id="wa-link" class="btn-action btn-wa" style="display:none;">💬 واتساب</a>
        </div>
        <p id="time-stamp" style="margin-top:35px; font-size:0.65rem; opacity:0.2; direction:ltr;"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const service = urlParams.get('service');
        const ward = urlParams.get('ward');
        
        // Ensure this matches your latest DEPLOYED Web App URL
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwyMCq_hD6onVuH0Pkvs9aKm32ohekevAZYrIO-hqWgAHKcciOZbpjGeLy7MaLVOWsIVA/exec";

        let dutyData = null;

        async function loadData() {
            if (!service || !ward) {
                document.getElementById('status').innerText = "⚠️ الرابط غير مكتمل";
                return;
            }

            try {
                const response = await fetch(`${scriptUrl}?service=${service}&ward=${ward}&json=true&t=${Date.now()}`);
                const data = await response.json();
                
                if (data && !data.error) {
                    dutyData = data;
                    document.getElementById('status').innerText = "تم تأمين الاتصال ✅";
                    document.getElementById('unlock-btn').disabled = false;
                } else {
                    document.getElementById('status').innerText = "لا يوجد خفر مسجل حالياً";
                }
            } catch (error) {
                document.getElementById('status').innerText = "وضع الأوفلاين - تحقق من النشر";
            }
        }

        function unlock() {
            const input = document.getElementById('pw');
            const pass = input.value;
            
            // Note: Since we separated GET (Lookup), the password check is done locally 
            // against your defined CONFIG.PASSWORD value (usually "1234")
            if (pass === "1234") { 
                document.getElementById('lock-screen').style.display = 'none';
                showUI();
            } else {
                document.getElementById('lock-screen').classList.add('shake');
                setTimeout(() => document.getElementById('lock-screen').classList.remove('shake'), 400);
                input.value = "";
            }
        }

        function showUI() {
            if (dutyData) {
                // Compatible with new flat JSON structure
                document.getElementById('service-display').innerText = dutyData.serviceAr || service;
                document.getElementById('name-display').innerText = dutyData.name;
                document.getElementById('phone-display').innerText = dutyData.phone;
                document.getElementById('call-link').href = "tel:" + dutyData.phone;
                document.getElementById('time-stamp').innerText = new Date().toLocaleString('ar-IQ');
                
                if (dutyData.whatsappDigits) {
                    const wa = document.getElementById('wa-link');
                    wa.style.display = 'flex';
                    wa.href = "https://wa.me/" + dutyData.whatsappDigits;
                }
            }
            const main = document.getElementById('main-content');
            main.style.display = 'block';
            setTimeout(() => main.style.opacity = '1', 50);
        }

        loadData();
    </script>
</body>
</html>
