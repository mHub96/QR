<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://script.google.com/macros/s/AKfycbzXPOdLnXVLfDNNj_WfVS4tT1HCb6qBzo5lghvX-pYZwCoCV4zcM5NOrJ5Jwp6x4qsJfg/exec">
    <link rel="dns-prefetch" href="https://script.google.com/macros/s/AKfycbzXPOdLnXVLfDNNj_WfVS4tT1HCb6qBzo5lghvX-pYZwCoCV4zcM5NOrJ5Jwp6x4qsJfg/exec">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام خفر الاستشارية</title>
    
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top left, #1a1a2e, #0a0a0c);
            color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        /* Animated Background Gradients */
        body::before {
            content: ""; position: absolute; width: 300px; height: 300px;
            background: var(--primary); filter: blur(120px);
            top: -100px; left: -100px; opacity: 0.2; z-index: -1;
        }

        /* Glassmorphism Card */
        .glass-card {
            width: 90%; max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 40px 25px;
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .icon-box {
            width: 80px; height: 80px; background: var(--glass);
            border-radius: 22px; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 20px; font-size: 2.5rem;
            border: 1px solid var(--glass-border);
        }

        h2 { margin: 0 0 10px; font-weight: 700; font-size: 1.6rem; letter-spacing: -0.5px; }
        #status { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 30px; }

        /* Modern Inputs */
        input[type="password"] {
            width: 100%; height: 65px; background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border); border-radius: 18px;
            color: white; font-size: 2rem; text-align: center;
            margin-bottom: 20px; outline: none; letter-spacing: 10px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        button {
            width: 100%; height: 60px; background: var(--primary);
            color: white; border: none; border-radius: 18px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        button:active { transform: scale(0.96); opacity: 0.9; }
        button:disabled { background: #333; cursor: not-allowed; }

        /* Results UI */
        .badge {
            display: inline-block; padding: 6px 16px; background: rgba(0,122,255,0.1);
            color: var(--primary); border-radius: 10px; font-size: 0.8rem;
            font-weight: 700; margin-bottom: 10px; text-transform: uppercase;
        }
        .name-title { font-size: 1.8rem; margin: 0 0 25px; font-weight: 800; }
        
        .info-row {
            background: rgba(0,0,0,0.2); padding: 20px; border-radius: 20px;
            margin-bottom: 25px; border: 1px solid var(--glass-border);
        }
        .phone-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); display: block; margin-bottom: 5px; }
        .phone-val { font-size: 1.8rem; font-weight: 800; color: white; direction: ltr; display: block; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-action {
            padding: 18px; border-radius: 18px; text-decoration: none;
            color: white; font-weight: 700; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-call { background: var(--primary); }
        .btn-wa { background: var(--success); }

        /* Loader */
        .spin { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: s 0.8s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="lock-screen" class="glass-card">
        <div class="icon-box">🛡️</div>
        <h2>دخول المصرح لهم</h2>
        <p id="status">جاري تأمين الاتصال...</p>
        
        <input type="password" id="pw" inputmode="numeric" placeholder="••••">
        
        <button id="unlock-btn" onclick="unlock()" disabled>
            <span id="btn-loader" class="spin" style="display:none;"></span>
            <span id="btn-text">جاري التحميل...</span>
        </button>
    </div>

    <div id="main-content" class="glass-card" style="display:none;">
        <div class="badge" id="service-display">SERVICE</div>
        <h1 class="name-title" id="name-display">د. محمد علي</h1>
        
        <div class="info-row">
            <span class="phone-label">رقم الهاتف المباشر</span>
            <span class="phone-val" id="phone-display">07700000000</span>
        </div>
        
        <div class="actions">
            <a href="#" id="call-link" class="btn-action btn-call">📞 اتصال</a>
            <a href="#" id="wa-link" class="btn-action btn-wa" style="display:none;">💬 واتساب</a>
        </div>
        <p id="time-stamp" style="margin-top:25px; font-size:0.7rem; opacity:0.3; direction:ltr;"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const service = urlParams.get('service');
        const ward = urlParams.get('ward');
        const scriptUrl = "YOUR_SCRIPT_URL_HERE";

        // Immediate Fetch
        window.dataPromise = fetch(`${scriptUrl}?service=${service}&ward=${ward}&json=true&t=${Date.now()}`)
            .then(res => res.json())
            .catch(() => null);

        async function init() {
            const data = await window.dataPromise;
            const btnText = document.getElementById('btn-text');
            const btn = document.getElementById('unlock-btn');
            
            if (data) {
                document.getElementById('status').innerText = "تم التحقق من البيانات ✅";
                btnText.innerText = "دخول";
                btn.disabled = false;
            } else {
                document.getElementById('status').innerText = "خطأ في الاتصال بالسيرفر";
            }
        }

        async function unlock() {
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const data = await window.dataPromise;
            
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';

            setTimeout(() => {
                const pass = document.getElementById('pw').value;
                if (data && pass === data.password.toString()) {
                    showData(data);
                } else {
                    alert("الرمز غير صحيح ❌");
                    btnText.style.display = 'block';
                    btnLoader.style.display = 'none';
                    document.getElementById('pw').value = "";
                }
            }, 400); // Small delay for "feel"
        }

        function showData(data) {
            document.getElementById('service-display').innerText = data.resident.serviceArabic;
            document.getElementById('name-display').innerText = data.resident.name;
            document.getElementById('phone-display').innerText = data.resident.phone;
            document.getElementById('time-stamp').innerText = data.timestamp;
            document.getElementById('call-link').href = "tel:" + data.resident.phone;
            
            if (data.whatsappDigits) {
                const wa = document.getElementById('wa-link');
                wa.style.display = 'flex';
                wa.href = "https://wa.me/" + data.whatsappDigits;
            }

            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        document.getElementById('pw').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('unlock-btn').disabled) unlock();
        });

        init();
    </script>
</body>
</html>
