<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول الخفر - العيادة الاستشارية</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #007BFF;
      --text: #ffffff;
      --text-dim: #bbbbbb;
      --success: #25D366;
    }
    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 20px; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 450px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }
    .badge {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(0, 123, 255, 0.15);
      color: var(--accent);
      border-radius: 50px;
      font-size: 0.95rem;
      margin-bottom: 15px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 2rem; margin: 10px 0; color: var(--text); }
    .contact-info {
      background: #282828;
      padding: 24px;
      border-radius: 20px;
      margin: 30px 0;
      border: 1px solid #383838;
    }
    .phone-num { 
      font-size: 1.8rem; 
      direction: ltr; 
      display: block; 
      margin-top: 8px; 
      color: var(--accent); 
      font-weight: 800; 
    }
    .btn-group { display: flex; gap: 14px; }
    .btn {
      flex: 1;
      padding: 18px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-call { background: var(--accent); color: white; }
    .btn-wa { background: var(--success); color: white; display: none; } /* Hidden by default */
    
    .footer-time { margin-top: 35px; font-size: 0.85rem; color: #777; direction: ltr; }

    /* Lock Screen Styling */
    #lock-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 1000; padding: 20px;
    }
    .pw-box { width: 100%; max-width: 340px; text-align: center; }
    input {
      width: 100%; padding: 18px; border-radius: 16px; border: 2px solid #333;
      background: #1e1e1e; color: white; font-size: 1.4rem; text-align: center; 
      margin: 25px 0; transition: border-color 0.3s;
    }
    input:focus { border-color: var(--accent); outline: none; }
    
    /* Content hidden until unlocked */
    #main-content { display: none; }
  </style>
</head>
<body>

  <div id="lock-screen">
    <div class="pw-box">
      <div style="font-size: 3rem; margin-bottom: 10px;">🛡️</div>
      <h2 style="margin-bottom:8px;">دخول المصرح لهم</h2>
      <p style="color:#888;">الرجاء إدخال رمز التحقق لعرض بيانات الطبيب</p>
      <input type="password" id="pw" pattern="[0-9]*" inputmode="numeric" placeholder="••••">
      <button onclick="unlock()" class="btn btn-call" style="width:100%; border:none; cursor:pointer;">دخول</button>
    </div>
  </div>

  <div class="container" id="main-content">
    <div class="badge" id="service-display">جاري التحميل...</div>
    <h1 id="name-display">...</h1>

    <div class="contact-info">
      <span style="color:#888; font-size:0.95rem;">رقم الهاتف المباشر</span>
      <span class="phone-num" id="phone-display">...</span>
    </div>

    <div class="btn-group">
      <a href="#" id="call-btn" class="btn btn-call">📞 اتصال هاتفـي</a>
      <a href="#" id="wa-btn" class="btn btn-wa">💬 واتســـاب</a>
    </div>

    <div class="footer-time" id="time-display">--/--/---- | --:-- --</div>
  </div>

  <script src="script.js"></script>

</body>
</html>
