:root {
--primary: #007aff;

            --bg-dark: #0a0a0c;

}

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

body {
margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 122, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(52, 199, 89, 0.05) 0%, transparent 50%);
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
color: white;
display: flex; justify-content: center; align-items: center;
min-height: 100vh; overflow: hidden;
}

        /* Animated Ambient Light */
        body::after {
            content: ""; position: absolute; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05; pointer-events: none; z-index: -1;
        /* Animated Mesh Background */
        .mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 211, 102, 0.1) 0px, transparent 50%);
            z-index: -1; filter: blur(40px);
}

        .glass-card {
            width: 92%; max-width: 400px;
        .container {
            width: 90%; max-width: 380px;
            padding: 40px 30px;
background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px; padding: 40px 28px;
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            animation: slideUp 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* Modern Icon Box */
.icon-box {
            width: 74px; height: 74px; background: rgba(255,255,255,0.04);
            border-radius: 22px; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 20px; font-size: 2.4rem;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
            width: 85px; height: 85px;
            margin: 0 auto 25px;
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

        h2 { margin: 0 0 8px; font-weight: 700; font-size: 1.6rem; letter-spacing: -0.5px; }
        #status { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-bottom: 30px; min-height: 1.2rem; }
        h2 { font-weight: 700; font-size: 1.7rem; margin-bottom: 10px; letter-spacing: -1px; }
        #status { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 35px; }

        /* The "Tesla" Input Style */
        .input-group {
            position: relative; margin-bottom: 25px;
        }

input[type="password"] {
            width: 100%; height: 65px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border); border-radius: 20px;
            color: white; font-size: 2rem; text-align: center;

            width: 100%; height: 70px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 22px;
            color: white; font-size: 2.5rem; text-align: center;
            letter-spacing: 12px; transition: 0.3s;
        }

        input:focus {
            background: rgba(255,255,255,0.07);
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
}
        input:focus { border-color: var(--primary); background: rgba(0,0,0,0.4); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

button {
            width: 100%; height: 62px; background: var(--primary);
            color: white; border: none; border-radius: 20px;
            font-size: 1.15rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            width: 100%; height: 65px;
            background: white; color: black;
            border: none; border-radius: 22px;
            font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s;
}
        button:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.2); cursor: not-allowed; }
        button:active:not(:disabled) { transform: scale(0.96); opacity: 0.9; }

        /* Results UI */
        button:disabled { background: #222; color: #555; }
        button:active { transform: scale(0.96); }

        /* Content UI Styling */
.badge {
            display: inline-block; padding: 6px 16px; background: rgba(0,122,255,0.15);
            color: var(--primary); border-radius: 10px; font-size: 0.85rem;
            font-weight: 700; margin-bottom: 12px; border: 1px solid rgba(0,122,255,0.2);
            background: var(--primary); color: white;
            padding: 6px 14px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 800;
            display: inline-block; margin-bottom: 15px;
}
        .name-title { font-size: 2rem; margin: 0 0 25px; font-weight: 800; color: #fff; }
        .info-row { background: rgba(0,0,0,0.3); padding: 24px; border-radius: 24px; margin-bottom: 28px; border: 1px solid var(--glass-border); }
        .phone-val { font-size: 1.9rem; font-weight: 800; color: #fff; direction: ltr; display: block; letter-spacing: 1px; }
        
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .btn-action { padding: 18px; border-radius: 18px; text-decoration: none; color: white; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; transition: transform 0.2s; }
        .btn-action:active { transform: scale(0.95); }

        .name-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }

        .info-card {
            background: rgba(255,255,255,0.03);
            padding: 25px; border-radius: 30px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .phone-label { font-size: 0.7rem; text-transform: uppercase; color: rgba(255,255,255,0.3); display: block; margin-bottom: 10px; letter-spacing: 1px; }
        .phone-val { font-size: 1.8rem; font-weight: 800; direction: ltr; display: block; color: var(--primary); }

        .btn-action {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 20px; border-radius: 22px;
            text-decoration: none; color: white; font-weight: 700;
            font-size: 0.95rem; flex: 1; transition: 0.2s;
        }

        .btn-call { background: #1a1a1a; border: 1px solid var(--border); }
        .btn-wa { background: var(--success); }

        /* Animations */
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }
        .shake { animation: shake 0.4s ease; }

        /* Spinner */
        .spin { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: rot 0.8s linear infinite; }
        .spin { width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.1); border-top-color: black; border-radius: 50%; animation: rot 0.8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
        
        /* Shake Animation */
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
</style>
